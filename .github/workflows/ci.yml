name: CI-CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u aacusi --password-stdin

      - name: Build Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Push Image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest